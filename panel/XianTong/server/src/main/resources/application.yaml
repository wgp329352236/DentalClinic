ktor:
  deployment:
    port: 8080
  application:
    modules:
      - com.dentalclinic.PreflightKt.configurePreflight
      - com.dentalclinic.SerializationKt.configureSerialization
      - com.dentalclinic.SecurityKt.configureSecurity
      - com.dentalclinic.KoinKt.configureKoin
      - com.dentalclinic.RoutingKt.configureRouting
      - com.dentalclinic.admin.AdminModuleKt.adminModule
      - com.dentalclinic.user.UserModuleKt.userModule

# ─── 数据库配置（PostgreSQL） ───
# 生产环境建议用环境变量覆盖（优先级高于此处）：
#   DB_URL / DB_USERNAME / DB_PASSWORD
# APP_ENV=prod 时 DB_PASSWORD 与 database.password 都缺失会直接启动失败（fail-fast）。
database:
  url: "r2dbc:postgresql://localhost:5432/dental_clinic"
  username: "postgres"
  password: "postgres"

# ─── 推荐分享 ───
# 「邀请好友」落地页地址前缀，小程序端会拼上 ?code=<推荐码> 后展示/分享。
# 未配置时回落到代码里的 example.com 占位值，并在启动日志里打 WARN 提醒；
# 上线前必须改成真实域名，否则用户点到的是一条死链。
referral:
  shareBaseUrl: ""

# ─── 门店到店签到码签名密钥 ───
# 签到码格式 dc1.<clinicId>.<HMAC-SHA256签名>，密钥用于管理端签发 / 用户扫码验签。
# 留空时每次启动生成随机密钥（仅限本地联调，重启后所有已打印签到码失效，日志打 WARN）。
# 生产必须配置稳定密钥（建议至少 32 位随机串）；也可用环境变量 CHECKIN_SIGNING_SECRET 注入，
# 环境变量优先级更高。轮换密钥后全部门店需重新打印签到码。
checkin:
  signingSecret: ""

# ─── JWT 签名密钥（管理端 + 用户端） ───
# 生产环境务必通过环境变量注入（优先级高于此处）：ADMIN_JWT_SECRET / USER_JWT_SECRET
# 生成方式：openssl rand -hex 32（两端必须使用各自独立的随机密钥）
# 留空时：本地开发自动使用内置开发默认值（启动日志打 WARN）；
#         APP_ENV=prod 时缺失任一密钥都会直接启动失败（fail-fast），防止带弱默认密钥上线。
# 轮换密钥会使所有已签发 token 失效，用户/管理员需重新登录。
admin:
  jwt:
    secret: ""
    # issuer: "ktor-bi-admin"   # 可选，默认 ktor-bi-admin

user:
  jwt:
    secret: ""

# ─── 微信小程序 / 微信支付 V3 ───
# 所有项留空时相关能力自动降级为 mock（仅限本地联调，启动日志会打 WARN）。
# 生产环境建议用环境变量注入，避免凭证进配置文件：
#   WECHAT_APP_ID / WECHAT_APP_SECRET
#   WECHAT_WXA_ENV_VERSION    # 可选：小程序码目标版本 release/trial/develop，默认 release
#   WECHAT_MCH_ID / WECHAT_API_V3_KEY / WECHAT_MERCHANT_SERIAL
#   WECHAT_PRIVATE_KEY 或 WECHAT_PRIVATE_KEY_PATH / WECHAT_PAY_NOTIFY_URL
#
# 推广二维码依赖 appId/appSecret：配置齐全后管理端「优惠券模板 → 推广码」生成真实小程序码
# （扫码直达小程序优惠券页自动领 2 张券，scene=promo=<templateId>）；未配置则降级为普通二维码，
# 客户微信内长按识别/扫一扫进入小程序走同一领券链路。小程序需先在微信公众平台完成发布/体验版上传，
# env_version 须与投放目标一致，否则扫码会提示「页面不存在」。
wechat:
  miniApp:
    appId: ""
    appSecret: ""
    # 小程序码目标版本：release=线上版（正式投放）、trial=体验版、develop=开发版
    wxaEnvVersion: "release"
  pay:
    mchId: ""
    apiV3Key: ""              # APIv3 密钥，固定 32 字节
    merchantSerialNumber: ""  # 商户证书序列号
    privateKey: ""            # 商户私钥 PEM 文本（也可用下面的 privateKeyPath 指定文件）
    privateKeyPath: ""        # apiclient_key.pem 的绝对路径
    notifyUrl: ""             # 支付结果通知地址，必须公网 HTTPS，如 https://api.example.com/api/v1/recharge/notify

